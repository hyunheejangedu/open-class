<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 대곡초 방과후 공개수업 방문증 발급</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
  }
  #app {
    width: 100%;
    max-width: 640px;
  }
  #form-wrap iframe {
    width: 100%;
    height: 732px;
    border: 0;
    display: block;
    background: #fff;
  }
  #result-wrap {
    display: none;
    text-align: center;
    background: #fff;
    border-radius: 12px;
    padding: 32px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  #result-wrap img {
    max-width: 100%;
    height: auto;
  }
  #result-wrap p {
    color: #333;
    font-size: 15px;
    line-height: 1.5;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="form-wrap">
      <iframe id="gform"
        src="https://docs.google.com/forms/d/e/1FAIpQLSdEdWJqWqUm4BxER-owAVOSRoAB06txcslZY5H6ghJX5PcxTg/viewform?embedded=true"
        frameborder="0" marginheight="0" marginwidth="0">로드 중…</iframe>
    </div>
    <div id="result-wrap">
      <img src="visitor-pass.png" alt="방문증">
      <p>제출이 완료되었습니다.<br>위 방문증 이미지를 화면에 보여주시거나 저장해 주세요.</p>
    </div>
  </div>

<script>
  var iframe = document.getElementById('gform');
  var loadCount = 0;
  iframe.addEventListener('load', function () {
    loadCount++;
    // 첫 로드는 폼이 처음 열릴 때이므로 무시하고,
    // 두 번째 로드부터는 "제출 완료" 페이지로 전환된 것으로 간주합니다.
    if (loadCount > 1) {
      document.getElementById('form-wrap').style.display = 'none';
      document.getElementById('result-wrap').style.display = 'block';
    }
  });
</script>
</body>
</html>
