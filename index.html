<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 대곡초 방과후 공개수업 및 전시회 방문증 발급</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  #app { width: 100%; max-width: 480px; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
  }

  h1 {
    font-size: 18px;
    line-height: 1.4;
    margin: 0 0 6px;
    color: #222;
  }
  .sub {
    font-size: 13px;
    color: #888;
    margin: 0 0 24px;
  }

  label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 18px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #6b5bd6; }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #6b5bd6;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { background: #5a4bc4; }

  #error {
    color: #d33;
    font-size: 13px;
    margin: -10px 0 14px;
    display: none;
  }

  #result-wrap { display: none; text-align: center; }
  .pass-wrap {
    position: relative;
    max-width: 340px;
    margin: 0 auto;
  }
  .pass-wrap img { width: 100%; display: block; }
   .pass-info {
    text-align: left;
    font-size: 15px;
    line-height: 1.8;
    color: #222;
    background: #fafafa;
    padding: 14px 16px;
    border-radius: 8px;
    margin-top: 14px;
  }
  .pass-info b { display: inline-block; width: 66px; }
  #result-wrap p.note {
    color: #555;
    font-size: 14px;
    margin-top: 22px;
  }
</style>
</head>
<body>
<div id="app">

  <div class="card" id="form-wrap">
    <h1>2026 대곡초 방과후 공개수업<br>방문증 발급정보</h1>
    <p class="sub">아래 정보를 입력하시면 방문증이 발급됩니다.</p>

    <label for="name">학생명 *</label>
    <input type="text" id="name" placeholder="예) 홍길동">

    <label for="grade">학년-반 * <span style="font-weight:400; color:#999; font-size:12px;">(예: 1-1 형식으로 입력)</span></label>
    <input type="text" id="grade" placeholder="예) 1-1">

    <label for="subject">수강과목 *</label>
    <input type="text" id="subject" placeholder="예) 회화미술">

    <div id="error">모든 항목을 입력해 주세요.</div>

    <button id="submitBtn">방문증 발급</button>
  </div>

  <div class="card" id="result-wrap">
    <div class="pass-wrap">
      <img src="visitor-pass.png" alt="방문증">
      <div class="pass-info">
        <div><b>이름</b><span id="out-name"></span></div>
        <div><b>학년-반</b><span id="out-grade"></span></div>
        <div><b>수강과목</b><span id="out-subject"></span></div>
      </div>
    </div>
    <p class="note">제출이 완료되었습니다.<br>입장 시 이 화면을 보여주세요.</p>
  </div>

</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>
<form id="gform"
      action="https://docs.google.com/forms/d/e/1FAIpQLSdEdWJqWqUm4BxER-owAVOSRoAB06txcslZY5H6ghJX5PcxTg/formResponse"
      method="POST" target="hidden_iframe" style="display:none;">
  <input type="text" name="entry.668140041" id="f-name">
  <input type="text" name="entry.546221312" id="f-grade">
  <input type="text" name="entry.1118081897" id="f-subject">
</form>

<script>
  document.getElementById('submitBtn').addEventListener('click', function () {
    var name = document.getElementById('name').value.trim();
    var grade = document.getElementById('grade').value.trim();
    var subject = document.getElementById('subject').value.trim();
    var errorBox = document.getElementById('error');
    var gradePattern = /^[1-6]-[1-9][0-9]?$/;

    if (!name || !grade || !subject) {
      errorBox.textContent = '모든 항목을 입력해 주세요.';
      errorBox.style.display = 'block';
      return;
    }
    if (!gradePattern.test(grade)) {
      errorBox.textContent = '학년-반은 "1-1" 형식으로 입력해 주세요. (예: 1학년 1반 → 1-1)';
      errorBox.style.display = 'block';
      return;
    }
    errorBox.style.display = 'none';

    document.getElementById('f-name').value = name;
    document.getElementById('f-grade').value = grade;
    document.getElementById('f-subject').value = subject;
    document.getElementById('gform').submit();

    document.getElementById('out-name').textContent = ' ' + name;
    document.getElementById('out-grade').textContent = ' ' + grade;
    document.getElementById('out-subject').textContent = ' ' + subject;

    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('result-wrap').style.display = 'block';
  });
</script>
</body>
</html>
